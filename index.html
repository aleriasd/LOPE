<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kale <3 Kina</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; width: 100%;
            text-align: center; z-index: 100; display:block;
            color: #444; font-family: Arial, sans-serif; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="info">Klik & Drag untuk memutar hati</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, heartParticles;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30; 
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true; // Biar muter otomatis
            controls.autoRotateSpeed = 1.0;

            createHeart();
            animate();
            window.addEventListener('resize', onWindowResize, false);
        }

        function createTextTexture() {
            // Fungsi ini buat bikin gambar "Kale <3 Kina"
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            
            context.fillStyle = 'rgba(0, 0, 0, 0)'; // Latar transparan
            context.fillRect(0, 0, size, size);
            
            context.fillStyle = '#FF69B4'; // Warna pink
            
            // --- <<< PERUBAHAN DI SINI >>> ---
            context.font = 'bold 22px Arial'; // Font size dikecilin dikit
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // Tulis "Kale <3 Kina" di SATU BARIS
            context.fillText("Kale <3 Kina", size / 2, size / 2); 
            // --- <<< --------------------- >>> ---
            
            return new THREE.CanvasTexture(canvas);
        }

        function createHeart() {
            const particleCount = 5000; // Jumlah partikel (tetap 5000)
            const points = [];
            const scaleFactor = 0.8; 

            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * 2 * Math.PI; 
                // Rumus Hati
                const x = scaleFactor * 16 * Math.pow(Math.sin(t), 3);
                const y = scaleFactor * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const z = (Math.random() - 0.5) * 5; 
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const texture = createTextTexture(); // Pakai tekstur baru (1 baris)
            const material = new THREE.PointsMaterial({
                map: texture,
                size: 2.0, // Ukuran partikel
                transparent: true,
                alphaTest: 0.1,
                blending: THREE.AdditiveBlending // Efek 'glow'
            });

            heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        // Jalankan!
        init();

    </script>

</body>
</html>
